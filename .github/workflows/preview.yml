# Publishes the test copy to GitHub Pages so reviewers have a link. This is NOT the launch site:
# the portable build carries noindex on every page, relative links (a project Pages site lives under
# /<repo>/) and no sitemap or canonical. The real site deploys from Cloudflare Pages — see DEPLOY.md.
# Enable once in the repository: Settings → Pages → Source: GitHub Actions.
name: Preview

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the portable test copy
        run: npm run build:portable

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-portable

      - id: deployment
        uses: actions/deploy-pages@v4
